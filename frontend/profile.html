<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SENTINEL | Profile</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .layout { display: flex; min-height: 100vh; }
        .sidebar { width: 250px; background: var(--bg-card); border-right: 1px solid var(--border-color); padding: 20px 0; }
        .sidebar-brand { font-size: 1.5rem; font-weight: bold; color: var(--orange); text-align: center; margin-bottom: 30px; }
        .nav-item { display: block; padding: 15px 20px; color: var(--text-main); text-decoration: none; transition: background 0.3s; }
        .nav-item:hover, .nav-item.active { background: rgba(29, 206, 216, 0.1); color: var(--cyan); border-left: 4px solid var(--cyan); }
        .nav-item i { width: 25px; }
        
        .main-content { flex: 1; padding: 30px; overflow-y: auto; }
        .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        
        .profile-container { display: grid; grid-template-columns: 1fr 2fr; gap: 30px; }
        .card { background: var(--bg-card); padding: 30px; border-radius: 8px; border: 1px solid var(--border-color); }
        
        .avatar-section { text-align: center; border-bottom: 1px solid var(--border-color); padding-bottom: 20px; margin-bottom: 20px; }
        .avatar { width: 120px; height: 120px; border-radius: 50%; background: var(--orange); color: #000; display: inline-flex; justify-content: center; align-items: center; font-size: 3rem; margin-bottom: 15px; }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: var(--text-muted); }
        .form-group input { width: 100%; padding: 12px; background: rgba(0,0,0,0.2); border: 1px solid var(--border-color); color: var(--text-main); border-radius: 4px; }
        .form-group input:disabled { opacity: 0.7; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="layout">
        <div class="sidebar">
            <div class="sidebar-brand"><i class="fa-solid fa-shield-halved"></i> SENTINEL</div>
            <a href="dashboard.html" class="nav-item"><i class="fa-solid fa-chart-line"></i> Dashboard</a>
            <a href="analyze.html" class="nav-item"><i class="fa-solid fa-microscope"></i> New Analysis</a>
            <a href="cases.html" class="nav-item"><i class="fa-solid fa-folder-open"></i> Cases</a>
            <a href="reports.html" class="nav-item"><i class="fa-solid fa-file-pdf"></i> Reports</a>
            <a href="analytics.html" class="nav-item"><i class="fa-solid fa-chart-pie"></i> Analytics</a>
            <a href="profile.html" class="nav-item active"><i class="fa-solid fa-user"></i> Profile</a>
            <a href="settings.html" class="nav-item"><i class="fa-solid fa-gear"></i> Settings</a>
            <a href="#" class="nav-item" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
        </div>
        
        <div class="main-content">
            <div class="topbar">
                <h2>Investigator Profile</h2>
            </div>
            
            <div class="profile-container">
                <div class="card">
                    <div class="avatar-section">
                        <div class="avatar" id="avatarInitials">IN</div>
                        <h3 id="profName">Loading...</h3>
                        <p class="text-muted">Forensic Investigator</p>
                    </div>
                    <div>
                        <p><strong><i class="fa-solid fa-shield-halved"></i> Security Level:</strong> Level 4 (Advanced)</p>
                        <p style="margin-top:10px;"><strong><i class="fa-solid fa-building"></i> Agency:</strong> MUSA Operations</p>
                    </div>
                </div>
                
                <div class="card">
                    <h3 style="margin-bottom: 25px; color:var(--cyan);"><i class="fa-solid fa-user-pen"></i> Account Details</h3>
                    <form id="profileForm">
                        <div class="form-group">
                            <label>Full Name</label>
                            <input type="text" id="inputName" value="" disabled>
                        </div>
                        <div class="form-group">
                            <label>Username / Email</label>
                            <input type="email" id="inputEmail" value="" disabled>
                        </div>
                        <div class="form-group">
                            <label>Investigator ID</label>
                            <input type="text" value="INV-9943-MUSA" disabled>
                        </div>
                        <button type="button" class="btn btn-primary" onclick="Toast.warning('Access Denied', 'Profile updates restricted by central command.')" style="background:var(--orange); color:#000; padding:12px 20px; border:none; border-radius:4px; font-weight:bold; cursor:pointer;">Request Update</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="js/theme.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const user = await checkAuth();
            if(!user) return;
            
            document.getElementById('profName').innerText = user.name || user.username;
            document.getElementById('inputName').value = user.name || user.username;
            document.getElementById('inputEmail').value = user.username;
            
            const initials = (user.name || user.username).substring(0, 2).toUpperCase();
            document.getElementById('avatarInitials').innerText = initials;
        });
    </script>
</body>
</html>
