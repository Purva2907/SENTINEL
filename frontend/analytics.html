<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        (function(){
            var theme = localStorage.getItem('sentinel_theme') || 'dark';
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SENTINEL | Analytics</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/chatbot.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .charts-container { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 30px; 
            margin-bottom: 30px; 
        }
        .chart-card { 
            display: flex;
            flex-direction: column;
            height: 350px;
        }
        .chart-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        @media (max-width: 1024px) {
            .charts-container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="forensic-bg"></div>
    <div class="forensic-grid"></div>

    <div class="layout">
        <div class="sidebar">
            <a href="dashboard.html" class="sidebar-brand" aria-label="SENTINEL Dashboard">
                <div class="sentinel-brand-mark" style="width:28px; height:28px; flex-shrink:0;">
                    <img src="assets/sentinel-mark.png" alt="SENTINEL" class="sentinel-mark-img sentinel-logo-dark" style="width:100%; height:100%; object-fit:contain;">
                    <img src="assets/sentinel-mark-light.png" alt="SENTINEL" class="sentinel-mark-img sentinel-logo-light" style="width:100%; height:100%; object-fit:contain;">
                </div>
                <span class="brand-text">SENTINEL</span>
            </a>
            <a href="dashboard.html" class="nav-item"><i class="fa-solid fa-chart-line"></i> Dashboard</a>
            <a href="analyze.html" class="nav-item"><i class="fa-solid fa-microscope"></i> New Analysis</a>
            <a href="cases.html" class="nav-item"><i class="fa-solid fa-folder-open"></i> Cases</a>
            <a href="lab.html" class="nav-item"><i class="fa-solid fa-flask-vial"></i> Synthetic Lab</a>
            <a href="compare.html" class="nav-item"><i class="fa-solid fa-code-compare"></i> Compare</a>
            <a href="reports.html" class="nav-item"><i class="fa-solid fa-file-pdf"></i> Reports</a>
            <a href="analytics.html" class="nav-item active"><i class="fa-solid fa-chart-pie"></i> Analytics</a>
            <a href="profile.html" class="nav-item"><i class="fa-solid fa-user-shield"></i> Profile</a>
            <a href="settings.html" class="nav-item"><i class="fa-solid fa-gear"></i> Settings</a>
            <div style="flex:1"></div>
            <a href="#" class="nav-item" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
        </div>
        
        <div class="main-content">
            <div class="topbar">
                <button class="mobile-menu-btn" onclick="document.querySelector('.sidebar').classList.toggle('open')">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <div class="topbar-left">
                    <h2>Forensic Analytics</h2>
                    <p>Aggregate insights across all completed investigations.</p>
                </div>
                <div class="topbar-right">
                    <div class="user-profile">
                        <div class="user-avatar" id="topAvatar">I</div>
                        <div class="user-info">
                            <span class="user-name" id="topName">Investigator</span>
                            <span class="user-role">Investigator</span>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="content-area" id="analyticsArea">
                <div style="text-align:center; padding:50px;">
                    <i class="fa-solid fa-circle-notch fa-spin" style="font-size: 2rem; color: var(--cyan); margin-bottom:15px; display:block;"></i>
                    <p style="color:var(--text-muted)">Aggregating analytical data...</p>
                </div>
            </div>
        </div>
    </div>

    <script src="js/brand.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/chatbot.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const user = await checkAuth();
            if(!user) return;
            
            if(user.name) {
                document.getElementById('topName').innerText = user.name;
                document.getElementById('topAvatar').innerText = user.name.charAt(0).toUpperCase();
            }
            
            // Chart global defaults
            Chart.defaults.color = '#a0a0a0';
            Chart.defaults.borderColor = 'rgba(255,255,255,0.05)';
            Chart.defaults.font.family = "'Inter', -apple-system, sans-serif";
            if (document.documentElement.getAttribute('data-theme') === 'light') {
                Chart.defaults.borderColor = 'rgba(0,0,0,0.05)';
            }
            
            loadAnalytics();
        });
        
        async function loadAnalytics() {
            try {
                const res = await fetchWithAuth(`${API_BASE}/analytics`);
                const stats = await res.json();
                const analyticsArea = document.getElementById('analyticsArea');
                
                if(stats.total_investigations === 0) {
                    analyticsArea.innerHTML = `
                        <div class="card" style="display:flex; justify-content:center; align-items:center; min-height:400px;">
                            <div class="empty-state" style="border:none; background:transparent;">
                                <i class="fa-solid fa-chart-pie empty-icon" style="font-size:4rem; opacity:0.3;"></i>
                                <h4>No analysis data available yet</h4>
                                <p>Analytics will appear after investigations are completed.</p>
                                <a href="analyze.html" class="btn-primary" style="margin-top:15px;">Start New Analysis</a>
                            </div>
                        </div>
                    `;
                    return;
                }
                
                // Build layout
                analyticsArea.innerHTML = `
                    <div class="stats-grid" style="grid-template-columns: repeat(2, 1fr);">
                        <div class="stat-card">
                            <i class="fa-solid fa-layer-group stat-icon"></i>
                            <div class="stat-title">Total Processed</div>
                            <div class="stat-value">${stats.total_investigations}</div>
                        </div>
                        <div class="stat-card stat-warning">
                            <i class="fa-solid fa-scale-balanced stat-icon"></i>
                            <div class="stat-title">Average Risk Score</div>
                            <div class="stat-value">${stats.average_risk} <span style="font-size:1rem; color:var(--text-muted); font-weight:normal; margin-left:5px;">/ 100</span></div>
                        </div>
                    </div>
                    
                    <div class="charts-container">
                        <div class="card chart-card">
                            <div class="card-header">
                                <h3><i class="fa-solid fa-chart-pie"></i> Risk Classification Distribution</h3>
                            </div>
                            <div class="chart-wrapper">
                                <canvas id="classChart"></canvas>
                            </div>
                        </div>
                        
                        <div class="card chart-card">
                            <div class="card-header">
                                <h3><i class="fa-solid fa-chart-bar"></i> Document Types Analyzed</h3>
                            </div>
                            <div class="chart-wrapper">
                                <canvas id="docTypeChart"></canvas>
                            </div>
                        </div>
                    </div>
                `;
                
                // Class Chart
                new Chart(document.getElementById('classChart'), {
                    type: 'doughnut',
                    data: {
                        labels: ['Likely Authentic', 'Review Required', 'High Suspicion'],
                        datasets: [{
                            data: [
                                stats.classification.likely_authentic || 0,
                                stats.classification.review_required || 0,
                                stats.classification.high_suspicion || 0
                            ],
                            backgroundColor: ['#55E07E', '#ffcc00', '#ff4d4d'],
                            borderWidth: 0,
                            hoverOffset: 4
                        }]
                    },
                    options: { 
                        responsive: true,
                        maintainAspectRatio: false,
                        cutout: '70%',
                        plugins: { 
                            legend: { position: 'bottom', labels: { boxWidth: 12, usePointStyle: true, padding: 20 } } 
                        }
                    }
                });
                
                // Doc Types Chart
                const docLabels = Object.keys(stats.document_types || {});
                const docData = Object.values(stats.document_types || {});
                new Chart(document.getElementById('docTypeChart'), {
                    type: 'bar',
                    data: {
                        labels: docLabels.length ? docLabels : ['No Data'],
                        datasets: [{
                            label: 'Volume',
                            data: docData.length ? docData : [0],
                            backgroundColor: '#1DCED8',
                            borderRadius: 4,
                            barPercentage: 0.6
                        }]
                    },
                    options: { 
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: { 
                            y: { beginAtZero: true, ticks: { stepSize: 1 }, grid: { drawBorder: false } },
                            x: { grid: { display: false, drawBorder: false } }
                        },
                        plugins: { legend: { display: false } } 
                    }
                });
                
            } catch(e) {
                console.error("Failed to load analytics", e);
                const analyticsArea = document.getElementById('analyticsArea');
                analyticsArea.innerHTML = `
                    <div class="card" style="display:flex; justify-content:center; align-items:center; min-height:400px; color:var(--danger);">
                        <div style="text-align:center;">
                            <i class="fa-solid fa-triangle-exclamation" style="font-size:3rem; margin-bottom:15px;"></i>
                            <h4>Unable to retrieve analytics</h4>
                        </div>
                    </div>
                `;
                Toast.error("Error", "Unable to retrieve analytics.");
            }
        }
    </script>
</body>
</html>
