<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SENTINEL | Analytics</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .layout { display: flex; min-height: 100vh; }
        .sidebar { width: 250px; background: var(--bg-card); border-right: 1px solid var(--border-color); padding: 20px 0; }
        .sidebar-brand { font-size: 1.5rem; font-weight: bold; color: var(--orange); text-align: center; margin-bottom: 30px; }
        .nav-item { display: block; padding: 15px 20px; color: var(--text-main); text-decoration: none; transition: background 0.3s; }
        .nav-item:hover, .nav-item.active { background: rgba(29, 206, 216, 0.1); color: var(--cyan); border-left: 4px solid var(--cyan); }
        .nav-item i { width: 25px; }
        
        .main-content { flex: 1; padding: 30px; overflow-y: auto; }
        .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        
        .charts-container { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-bottom: 30px; }
        .chart-card { background: var(--bg-card); padding: 25px; border-radius: 8px; border: 1px solid var(--border-color); }
        .chart-card h3 { color: var(--text-muted); margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="layout">
        <div class="sidebar">
            <div class="sidebar-brand"><i class="fa-solid fa-shield-halved"></i> SENTINEL</div>
            <a href="dashboard.html" class="nav-item"><i class="fa-solid fa-chart-line"></i> Dashboard</a>
            <a href="analyze.html" class="nav-item"><i class="fa-solid fa-microscope"></i> New Analysis</a>
            <a href="cases.html" class="nav-item"><i class="fa-solid fa-folder-open"></i> Cases</a>
            <a href="reports.html" class="nav-item"><i class="fa-solid fa-file-pdf"></i> Reports</a>
            <a href="analytics.html" class="nav-item active"><i class="fa-solid fa-chart-pie"></i> Analytics</a>
            <a href="#" class="nav-item"><i class="fa-solid fa-user"></i> Profile</a>
            <a href="#" class="nav-item"><i class="fa-solid fa-gear"></i> Settings</a>
            <a href="#" class="nav-item" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
        </div>
        
        <div class="main-content">
            <div class="topbar">
                <h2>Forensic Analytics</h2>
                <a href="#" class="btn btn-primary" style="background:var(--cyan); color:#000; padding: 10px 20px; border-radius:4px; text-decoration:none; font-weight:bold;">
                    <i class="fa-solid fa-download"></i> Export Data
                </a>
            </div>
            
            <div class="charts-container">
                <div class="chart-card">
                    <h3>Risk Classification Distribution</h3>
                    <canvas id="classChart"></canvas>
                </div>
                
                <div class="chart-card">
                    <h3>Document Types Analyzed</h3>
                    <canvas id="docTypeChart"></canvas>
                </div>
            </div>
            
            <div class="chart-card" style="margin-bottom:30px;">
                <h3>Average Risk Score by Document Type</h3>
                <canvas id="riskScoreChart" style="height:250px;"></canvas>
            </div>
        </div>
    </div>

    <script src="js/theme.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const user = await checkAuth();
            if(!user) return;
            
            Chart.defaults.color = '#a0a0a0';
            Chart.defaults.borderColor = '#333';
            
            loadAnalytics();
        });
        
        async function loadAnalytics() {
            try {
                const res = await fetchWithAuth(`${API_BASE}/analytics`);
                const stats = await res.json();
                
                // Class Chart
                new Chart(document.getElementById('classChart'), {
                    type: 'pie',
                    data: {
                        labels: ['Likely Authentic', 'Review Required', 'High Suspicion'],
                        datasets: [{
                            data: [
                                stats.classification.likely_authentic,
                                stats.classification.review_required,
                                stats.classification.high_suspicion
                            ],
                            backgroundColor: ['#55E07E', '#ffcc00', '#ff4d4d'],
                            borderWidth: 1,
                            borderColor: '#1a1a1a'
                        }]
                    },
                    options: { responsive: true }
                });
                
                // Doc Types Chart
                const docLabels = Object.keys(stats.document_types || {});
                const docData = Object.values(stats.document_types || {});
                new Chart(document.getElementById('docTypeChart'), {
                    type: 'bar',
                    data: {
                        labels: docLabels.length ? docLabels : ['No Data'],
                        datasets: [{
                            label: 'Volume',
                            data: docData.length ? docData : [0],
                            backgroundColor: '#FF9D50'
                        }]
                    },
                    options: { responsive: true, plugins: { legend: { display: false } } }
                });
                
                // Mocking risk by doc type for the detailed chart
                new Chart(document.getElementById('riskScoreChart'), {
                    type: 'line',
                    data: {
                        labels: docLabels.length ? docLabels : ['Aadhaar', 'PAN', 'Passport'],
                        datasets: [{
                            label: 'Avg Risk Score',
                            data: docLabels.length ? docLabels.map(l => Math.random() * 50 + 20) : [45, 65, 30],
                            borderColor: '#1DCED8',
                            backgroundColor: 'rgba(29, 206, 216, 0.2)',
                            fill: true,
                            tension: 0.4
                        }]
                    },
                    options: { 
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: { y: { min: 0, max: 100 } }
                    }
                });
                
            } catch(e) {
                console.error("Failed to load analytics", e);
                Toast.error("Error", "Failed to load analytics data.");
            }
        }
    </script>
</body>
</html>
