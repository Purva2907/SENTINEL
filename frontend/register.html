<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SENTINEL | Register</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .auth-container { max-width: 400px; margin: 50px auto; padding: 30px; background: var(--bg-card); border-radius: 8px; border: 1px solid var(--border-color); text-align: center; }
        .auth-container h1 { color: var(--orange); margin-bottom: 5px; }
        .auth-container p { color: var(--text-muted); margin-bottom: 25px; }
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input { width: 100%; padding: 12px; background: var(--bg-main); color: var(--text-main); border: 1px solid var(--border-color); border-radius: 4px; }
        .btn-auth { width: 100%; padding: 12px; background: var(--cyan); color: #000; border: none; font-weight: bold; border-radius: 4px; cursor: pointer; margin-top: 10px; }
        .auth-links { margin-top: 20px; font-size: 0.9rem; }
        .auth-links a { color: var(--cyan); text-decoration: none; margin: 0 10px; }
        .password-wrapper { position: relative; display: flex; align-items: center; }
        .password-wrapper input { padding-right: 40px; }
        .password-wrapper .toggle-password { position: absolute; right: 10px; background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 1.1rem; padding: 0; display: flex; align-items: center; justify-content: center; }
        .password-wrapper .toggle-password:hover { color: var(--cyan); }
    </style>
</head>
<body>
    <div class="auth-container">
        <h1><i class="fa-solid fa-user-plus"></i> Register</h1>
        <p>Create an Investigator Account</p>

        <form id="registerForm">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="fullName" required>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <div class="password-wrapper">
                    <input type="password" id="password" required minlength="6">
                    <button type="button" class="toggle-password" aria-label="Show password" onclick="togglePasswordVisibility('password', this)">
                        <i class="fa-solid fa-eye"></i>
                    </button>
                </div>
            </div>
            <div class="form-group">
                <label>Confirm Password</label>
                <div class="password-wrapper">
                    <input type="password" id="confirmPassword" required minlength="6">
                    <button type="button" class="toggle-password" aria-label="Show password" onclick="togglePasswordVisibility('confirmPassword', this)">
                        <i class="fa-solid fa-eye"></i>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn-auth" id="registerBtn">Create Account</button>
        </form>

        <div class="auth-links">
            <a href="login.html">Already have an account? Sign In</a>
        </div>
    </div>

    <script src="js/theme.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/auth.js"></script>
    <script>
        if(getToken()) window.location.href = 'dashboard.html';

        let isSubmitting = false;

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            // Clear existing error toasts to prevent stacking
            document.querySelectorAll('.toast-error').forEach(t => t.remove());

            if (isSubmitting) return;

            const btn = document.getElementById('registerBtn');
            const pwd = document.getElementById('password').value;
            const confirm = document.getElementById('confirmPassword').value;

            if(pwd !== confirm) {
                Toast.error('Password Mismatch', 'Passwords do not match');
                return;
            }

            isSubmitting = true;
            btn.disabled = true;
            btn.innerText = 'Creating Account...';
            const loadingToast = Toast.loading("Registering...");

            try {
                const response = await fetch(`${API_BASE}/auth/register`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        name: document.getElementById('fullName').value,
                        email: document.getElementById('email').value,
                        password: pwd
                    })
                });

                const data = await response.json();
                loadingToast.dismiss();

                if(response.ok) {
                    Toast.success('Registration successful', 'Please sign in to continue.');
                    setTimeout(() => { window.location.href = 'login.html'; }, 1500);
                } else {
                    Toast.error('Registration failed', getErrorMessage(data));
                }
            } catch(e) {
                loadingToast.dismiss();
                Toast.error('Network error', 'Unable to connect to the SENTINEL server. Please check that the backend is running.');
            } finally {
                isSubmitting = false;
                btn.disabled = false;
                btn.innerText = 'Create Account';
            }
        });
    </script>
</body>
</html>
