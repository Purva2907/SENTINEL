<svg fill="none" viewBox="0 0 1000 180" width="1000" height="180" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .flow-container {
          width: 1000px;
          height: 180px;
          background: #090e17;
          border-radius: 10px;
          border: 1px solid rgba(29, 206, 216, 0.25);
          position: relative;
          overflow: hidden;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
          color: #e2e8f0;
          display: flex;
          align-items: center;
          justify-content: space-around;
          padding: 0 20px;
          box-sizing: border-box;
          box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        /* Ambient scanline */
        .ambient-line {
          position: absolute;
          top: 0; left: -50%;
          width: 30%;
          height: 100%;
          background: linear-gradient(90deg, transparent, rgba(29, 206, 216, 0.05), transparent);
          animation: sweep-line 5s infinite linear;
          pointer-events: none;
        }
        @keyframes sweep-line {
          0% { left: -30%; }
          100% { left: 130%; }
        }

        .step-node {
          position: relative;
          z-index: 5;
          display: flex;
          flex-direction: column;
          align-items: center;
          text-align: center;
          width: 135px;
        }

        .icon-box {
          width: 52px;
          height: 52px;
          border-radius: 10px;
          background: rgba(16, 26, 42, 0.9);
          border: 1px solid rgba(29, 206, 216, 0.3);
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: 20px;
          color: #1DCED8;
          box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
          position: relative;
          transition: all 0.3s;
        }

        .icon-box.highlight {
          border-color: #FF9D50;
          color: #FF9D50;
          box-shadow: 0 0 15px rgba(255, 157, 80, 0.3);
        }

        .icon-box.green {
          border-color: #55E07E;
          color: #55E07E;
          box-shadow: 0 0 15px rgba(85, 224, 126, 0.3);
        }

        .step-tag {
          font-size: 9px;
          font-family: monospace;
          color: #64748b;
          text-transform: uppercase;
          letter-spacing: 1px;
          margin-top: 8px;
        }

        .step-label {
          font-size: 11px;
          font-weight: 700;
          color: #f1f5f9;
          margin-top: 3px;
          line-height: 1.3;
        }

        /* Animated connection wire */
        .conn-track {
          flex: 1;
          height: 2px;
          background: rgba(255, 255, 255, 0.08);
          position: relative;
          margin: 0 -10px 40px -10px;
          z-index: 2;
        }

        .data-packet {
          position: absolute;
          top: -2px;
          left: 0;
          width: 14px;
          height: 6px;
          background: #1DCED8;
          border-radius: 3px;
          box-shadow: 0 0 10px #1DCED8, 0 0 20px #1DCED8;
          animation: travel 2.5s infinite ease-in-out;
        }

        @keyframes travel {
          0% { left: 0%; opacity: 0; }
          20% { opacity: 1; }
          80% { opacity: 1; }
          100% { left: 95%; opacity: 0; }
        }

        .data-packet.delay-1 { animation-delay: 0.5s; }
        .data-packet.delay-2 { animation-delay: 1.0s; }
        .data-packet.delay-3 { animation-delay: 1.5s; }
        .data-packet.delay-4 { animation-delay: 2.0s; }
      </style>

      <div class="flow-container">
        <div class="ambient-line"></div>

        <!-- Node 1 -->
        <div class="step-node">
          <div class="icon-box">📥</div>
          <div class="step-tag">STAGE 01</div>
          <div class="step-label">Document Ingest</div>
        </div>

        <div class="conn-track">
          <div class="data-packet"></div>
        </div>

        <!-- Node 2 -->
        <div class="step-node">
          <div class="icon-box green">🔗</div>
          <div class="step-tag">STAGE 02</div>
          <div class="step-label">SHA-256 Custody</div>
        </div>

        <div class="conn-track">
          <div class="data-packet delay-1"></div>
        </div>

        <!-- Node 3 -->
        <div class="step-node">
          <div class="icon-box">🔬</div>
          <div class="step-tag">STAGE 03</div>
          <div class="step-label">6-Vector Analysis</div>
        </div>

        <div class="conn-track">
          <div class="data-packet delay-2"></div>
        </div>

        <!-- Node 4 -->
        <div class="step-node">
          <div class="icon-box highlight">🧬</div>
          <div class="step-tag">STAGE 04</div>
          <div class="step-label">11-D Fingerprint</div>
        </div>

        <div class="conn-track">
          <div class="data-packet delay-3"></div>
        </div>

        <!-- Node 5 -->
        <div class="step-node">
          <div class="icon-box">⚖️</div>
          <div class="step-tag">STAGE 05</div>
          <div class="step-label">Case Dossier</div>
        </div>

        <div class="conn-track">
          <div class="data-packet delay-4"></div>
        </div>

        <!-- Node 6 -->
        <div class="step-node">
          <div class="icon-box green">📑</div>
          <div class="step-tag">STAGE 06</div>
          <div class="step-label">PDF &amp; Compare</div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
